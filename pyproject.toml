[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fixion"
version = "0.1.0"
description = "SWE-bench-style autonomous coding agent: read → localize → debug → fix → test → verify"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # LLM + Embeddings
    "google-genai>=1.0.0",

    # AST Parsing
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",

    # Symbol graph
    "networkx>=3.3",

    # Vector DB
    "lancedb>=0.9.0",
    "pyarrow>=16.0.0",

    # Git operations
    "gitpython>=3.1.40",

    # Docker sandbox
    "docker>=7.1.0",

    # CLI
    "click>=8.1.0",
    "rich>=13.7.0",

    # Patch handling
    "unidiff>=0.7.5",

    # Config / env
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # HTTP (SWE-bench dataset, GitHub API)
    "httpx>=0.27.0",
    "PyGithub>=2.3.0",

    # Eval
    "datasets>=2.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-json-report>=1.5.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-networkx",
]

[project.scripts]
fixion = "cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
